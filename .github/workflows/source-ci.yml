name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.10.0'
      - name: Compile maintainer scripts and test package integrity
        run: |
          python3 -m compileall -q native-aot benchmarks
          python3 -m unittest discover -s native-aot/release/tests -v
          bash -n native-aot/release/launcher.sh
          bash -n native-aot/release/install.sh
          bash -n native-aot/release/manage.sh
      - name: Check exact Photon source guard and relocation
        run: |
          npm ci --prefix native-aot/pi-1.0-runtime --ignore-scripts
          node native-aot/release/tests/photon-relocation.mjs native-aot/pi-1.0-runtime/node_modules/@earendil-works/pi-coding-agent
          node native-aot/release/tests/image-worker-cleanup.mjs native-aot/pi-1.0-runtime/node_modules/@earendil-works/pi-coding-agent
